[device]
codename = "star"
brand = "Xiaomi"
model = "Xiaomi 11 Ultra"
ab = true
soc = { hans = "骁龙888 5G移动平台", hant = "驍龍888 5G行動平台", en = "Snapdragon 888 5G Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1440
height = 3200
density = 560
diagonal = 6.81

[modules]
# The phone keeps its modules in the vendor partition: it has no
# vendor_boot modules and no vendor_dlkm of its own.
sources = ["vendor"]
# The touchscreen: ST FTS over SPI (k2 build), beside xiaomi_touch.
# Both are listed in the phone's own modules.load.
load = ["fts_touch_spi_k2", "xiaomi_touch"]

# What the phone's own init runs once the system has finished starting:
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. Without it
# the CPUs stay at their highest clock and voltage even while idle, and
# the phone slowly heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
# Its own rc starts it as root with the root group alone.
[[service]]
path = "/vendor/bin/qseecomd"
own_libraries = true
libraries = ["/product/lib64", "/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root"]

# The firmware of the WLAN chip is on the modem partition, which the
# phone mounts at /vendor/firmware_mnt (and links at /firmware) and its
# own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist.
# The WLAN's MAC address is kept there.
[partitions]
mounted = ["persist"]

# WLAN: the WCN6855 on PCIe, driven by qca_cld3_qca6390 (the qca6390
# profile, which the WCN6855 shares) over the cnss2 platform driver,
# beside qca_cld3_wlan, as the phone's own init.target.rc loads them.
# Once fs_ready is written, cnss2 powers the chip up and loads its
# firmware from the modem partition, and wlan0 appears. The settings
# come from the vendor partition's wifi folder, the MAC address from
# persist.
[wlan]
modules = ["cnss2", "qca_cld3_wlan", "qca_cld3_qca6390"]
writes = [
    { path = "/sys/devices/platform/soc/b0000000.qcom,cnss-qca6490/fs_ready", value = "1" },
]
firmware = [
    { name = "wlan/qca_cld/qca6390/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6390/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/qca6390/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
    { name = "amss20.bin", partition = "modem", path = "image/amss20.bin" },
    { name = "m3.bin", partition = "modem", path = "image/m3.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. And what of the
# data partition a backup leaves out because the secure world keeps it in
# step with itself.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

# Where the phone's own programs keep logs in the data partition.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
